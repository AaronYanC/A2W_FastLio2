    # Offline-safe starting values. They are not JT128 hardware tuned.
    local_map:
      neighbor_keyframes_before: 5
      neighbor_keyframes_after: 5
      voxel_leaf_m: 0.2
      max_points: 200000
    quatro:
      fpfh_normal_radius_m: 0.5
      fpfh_radius_m: 0.8
      noise_bound_m: 0.25
      rotation_gnc_factor: 1.4
