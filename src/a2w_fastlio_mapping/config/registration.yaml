      rotation_max_iterations: 100
      estimate_scale: false
      optimized_matching: true
      descriptor_distance_threshold: 30.0
      maximum_correspondences: 500
      minimum_points: 20
    nano_gicp:
      maximum_correspondence_distance_m: 2.0
      thread_count: 0
      correspondence_randomness: 20
      maximum_iterations: 64
      transformation_epsilon: 0.001
      rotation_epsilon: 0.001
